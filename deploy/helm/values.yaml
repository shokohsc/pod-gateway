# Registry and image tags for the three images, mirroring the Makefile's REGISTRY/IMAGE_TAG convention.
registry: ghcr.io/example
tag: latest
imagePullPolicy: IfNotPresent

# Remote URL the gateway container fetches the openvpn client config from
# (re-downloaded at every container start) and writes to /etc/openvpn/client.ovpn.
configURL: ""

# RFC1918-ish range used inside the cluster (cluster pod/service CIDR). The kill-switch accepts this range
# from the tunnel so cluster-internal traffic bypasses the VPN.
clusterCIDR: "10.244.0.0/16"

# CIDR of the cluster Service network (CoreDNS ClusterIPs, etc.). Pinned to the real interface on both
# client and gateway so in-cluster service/DNS traffic never enters the tunnel or hits the kill-switch.
clusterServicesCIDR: "10.96.0.0/12"

# CIDR of the gateway's tun interface. The kill-switch routes/tracks this range.
gatewayCIDR: "10.8.0.2/32"

# Redirect target for the webhook's injected routing-init container: the vpn-egress-gateway Service
# FQDN (default) or a literal ClusterIP. The routing-init initContainer resolves a name to the
# Service's IP before creating the vxlan tunnel, so either works.
gatewayIP: ""

# VXLAN overlay between mutated pods and the gateway. Clients point their tunnel at the gateway
# Service IP; the gateway forwards their (destination-intact) packets into the OpenVPN tunnel.
# vxlanNet's last octet must be 0; the gateway takes .1 and each client takes .2.
vxlanID: "1000"
vxlanPort: "4790"
vxlanNet: "10.255.0.0/16"

# Pod tolerations (e.g. for Talos control-plane taints). Empty by default.
tolerations: []
# - key: node-role.kubernetes.io/control-plane
#   operator: Exists

# OpenVPN log verbosity (0-11). Set higher when debugging tunnel issues.
vpnLogLevel: "1"

# Data-channel ciphers the client offers. The default list (OpenVPN 2.6 GCM set
# plus AES-128-CBC) connects to servers that only support the legacy CBC cipher.
# Override to match a different VPN provider.
dataCiphers: "AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:AES-128-CBC"

# Image repository names (without registry or tag), matching the Makefile's docker-build convention.
gateway:
  image: gateway

routingInit:
  image: routing-init

webhook:
  image: vpn-egress-gateway
  replicaCount: 1
  listenAddr: ":8443"
  # Plaintext HTTP listener for kubelet liveness/readiness probes (the TLS port cannot be probed).
  healthAddr: ":8080"
  # Annotation that opts a pod into egress routing.
  annotationKey: "vpn.example.com/egress"
  # Single source of truth for the webhook serving certificate. The Certificate, the secret it
  # produces, and the webhook Deployment's mounted secret must all agree.
  certName: vpn-egress-webhook-cert
  tlsSecretName: vpn-egress-webhook-cert
  # Name of the cert-manager ClusterIssuer that issues the webhook serving certificate.
  issuer:
    name: "vpn-egress-private-ca"
