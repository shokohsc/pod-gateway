apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.webhook.certName }}
  labels:
    app: vpn-egress-webhook
spec:
  secretName: {{ .Values.webhook.tlsSecretName }}
  dnsNames:
    - vpn-egress-webhook.{{ .Release.Namespace }}.svc
  issuerRef:
    name: {{ .Values.webhook.issuer.name }}
    kind: ClusterIssuer
